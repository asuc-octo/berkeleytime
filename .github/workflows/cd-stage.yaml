name: "CD: Deploy to Staging"

concurrency:
  group: staging
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]

jobs:
  build-push:
    name: Build and Push Images and Charts
    uses: ./.github/workflows/cd-build.yaml
    with:
      image_tag: latest
      chart_ver: 0.1.0-stage
    secrets: inherit

  deploy:
    name: SSH and Deploy
    needs: [build-push]
    uses: ./.github/workflows/cd-deploy.yaml
    with:
      environment: staging
      name: bt-stage-app
      version: 0.1.0-stage
      values: |
        env: stage
        frontend:
          image:
            tag: latest
        backend:
          # One pod is enough for staging; prod runs two.
          replicas: 1
          resources:
            requests:
              cpu: '100m'
          image:
            tag: latest
        semanticSearch:
          resources:
            requests:
              cpu: '100m'
              memory: '256Mi'
            limits:
              cpu: '500m'
              memory: '1Gi'
          image:
            tag: latest
        # Staging shares the node with prod, so its jobs are capped and run
        # an hour after prod's instead of at the same minute. Enrollment runs
        # hourly instead of every 15 minutes, off prod's :00/:15/:30/:45.
        datapuller:
          resources:
            requests:
              cpu: '50m'
              memory: '256Mi'
            limits:
              cpu: '1'
              memory: '2Gi'
          cronjobs:
            terms-all:
              schedule: '0 5 1 * *'
            terms-nearby:
              schedule: '0 5,17 2-31 * *'
            courses:
              schedule: '5 5,17 * * *'
            sections-l5y:
              schedule: '10 5 1 * *'
            sections-active:
              schedule: '15 5,17 2-31 * *'
            classes-l5y:
              schedule: '20 5 1 * *'
            classes-active:
              schedule: '45 5,17 2-31 * *'
            decals:
              schedule: '28 5 * * *'
            grades-l5y:
              schedule: '35 5 1 * *'
            grades-recent:
              schedule: '30 5 2-31 * *'
            enrollments:
              schedule: '7 * * * *'
            enrollment-timeframe:
              schedule: '40 5 * * *'
          image:
            tag: latest
        host: staging.berkeleytime.com
        mongoUri: mongodb://bt-stage-mongo-mongodb-0.bt-stage-mongo-mongodb-headless.bt.svc.cluster.local:27017/bt
        redisUri: redis://bt-stage-redis-master.bt.svc.cluster.local:6379
      host: staging.berkeleytime.com
    secrets: inherit
