# Prometheus configuration for local development
# Scrapes metrics from the OpenTelemetry Collector's Prometheus exporter

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape OTel Collector's Prometheus exporter endpoint
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:9464"]
        labels:
          deployment_environment: local
    metric_relabel_configs:
      - source_labels: [exported_deployment_environment]
        regex: (.+)
        target_label: deployment_environment
      - action: labeldrop
        regex: exported_deployment_environment
      - source_labels: [k8s_namespace_name]
        regex: (.+)
        target_label: namespace
      - source_labels: [k8s_pod_name]
        regex: (.+)
        target_label: pod

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels:
          deployment_environment: local

  - job_name: otel-collector-internal
    static_configs:
      - targets: [otel-collector:8888]
        labels:
          deployment_environment: local
