# OpenTelemetry Collector - receives telemetry from backend/frontend, exports to Tempo/Loki/Prometheus
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    {{- include "bt-observability.collectorLabels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "bt-observability.collectorConfig" . | nindent 4 }}

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    {{- include "bt-observability.collectorLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        {{- include "bt-observability.collectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include "bt-observability.collectorConfig" . | sha256sum }}
    spec:
      containers:
        - name: otel-collector
          image: {{ .Values.collector.image }}
          args:
            - "--config=/etc/otelcol/config.yaml"
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: internal
              containerPort: 8888
              protocol: TCP
            - name: prometheus
              containerPort: 9464
              protocol: TCP
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
      volumes:
        - name: config
          configMap:
            name: otel-collector-config

---

apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    {{- include "bt-observability.collectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: prometheus
      port: 9464
      targetPort: 9464
      protocol: TCP
    - name: internal
      port: 8888
      targetPort: 8888
      protocol: TCP
