# Prometheus - metrics storage and query
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    {{- include "bt-observability.prometheusLabels" . | nindent 4 }}
data:
  prometheus.yml: |
    {{- include "bt-observability.prometheusConfig" . | nindent 4 }}
{{- if .Values.resourceMetrics.enabled }}
  resources.yml: |
    {{- .Files.Get "files/resources.yml" | nindent 4 }}
{{- end }}

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  labels:
    {{- include "bt-observability.prometheusLabels" . | nindent 4 }}
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.prometheus.storage.size }}

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    {{- include "bt-observability.prometheusLabels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        {{- include "bt-observability.prometheusLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include "bt-observability.prometheusConfig" . | sha256sum }}
        checksum/rules: {{ .Files.Get "files/resources.yml" | sha256sum }}
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time={{ .Values.prometheus.retention }}"
            - "--storage.tsdb.retention.size={{ .Values.prometheus.retentionSize }}"
            - "--web.enable-lifecycle"
            - "--web.enable-remote-write-receiver"
            - "--query.max-samples={{ .Values.prometheus.queryMaxSamples | int }}"
          env:
            - name: GOMEMLIMIT
              value: {{ .Values.prometheus.goMemLimit | quote }}
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            {{- if .Values.resourceMetrics.enabled }}
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            {{- end }}
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
      volumes:
        {{- if .Values.resourceMetrics.enabled }}
        - name: rules
          configMap:
            name: prometheus-config
            items:
              - key: resources.yml
                path: resources.yml
        {{- end }}
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data

---

apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    {{- include "bt-observability.prometheusLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      protocol: TCP
