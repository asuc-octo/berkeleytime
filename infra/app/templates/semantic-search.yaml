apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bt-app.semanticSearchName" . }}
  labels:
    {{- include "bt-app.semanticSearchLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.semanticSearch.replicas }}
  selector:
    matchLabels:
      {{- include "bt-app.semanticSearchLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bt-app.semanticSearchLabels" . | nindent 8 }}
    spec:
      containers:
        - name: semantic-search
          image: {{ printf "%s/%s:%s" .Values.semanticSearch.image.registry .Values.semanticSearch.image.repository ( toString .Values.semanticSearch.image.tag ) }}
          {{- if eq .Values.semanticSearch.image.tag "local" }}
          imagePullPolicy: IfNotPresent
          {{- else }}
          imagePullPolicy: Always
          {{- end }}
          ports:
            - containerPort: {{ .Values.semanticSearch.port }}
          envFrom:
            - configMapRef:
                name: {{ include "bt-app.semanticSearchName" . }}-env
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.semanticSearch.port }}
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.semanticSearch.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: indexes
              mountPath: /app/indexes
            - name: model-cache
              mountPath: /root/.cache/huggingface
      volumes:
        {{- /* Per-release folder; see semanticSearch.indexHostPath in values.yaml. */}}
        - name: indexes
          hostPath:
            path: {{ .Values.semanticSearch.indexHostPath }}
            type: DirectoryOrCreate
        {{- /*
        Shared across all releases on the node on purpose. It only holds the
        Hugging Face download of the embedding model (MODEL_NAME in
        apps/semantic-search/app/engine.py). That cache is keyed by model name
        and commit, so environments on different models get separate
        subfolders and never overwrite each other's files.
        */}}
        - name: model-cache
          hostPath:
            path: /data/semantic-search-model-cache
            type: DirectoryOrCreate

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bt-app.semanticSearchName" . }}-env
  labels:
    {{- include "bt-app.semanticSearchLabels" . | nindent 4 }}
data:
  INDEX_STORAGE_DIR: "/app/indexes"
  SEMANTIC_SEARCH_LOG_LEVEL: {{ .Values.semanticSearch.logLevel | quote }}
  REDIS_URI: {{ .Values.redisUri }}
  BACKEND_URL: {{ printf "http://%s-svc:%d" (include "bt-app.backendName" .) (.Values.port | int) | quote }}
  {{- if .Values.semanticSearch.defaultYear }}
  SEMANTIC_SEARCH_YEAR: {{ .Values.semanticSearch.defaultYear | quote }}
  {{- end }}
  {{- if .Values.semanticSearch.defaultSemester }}
  SEMANTIC_SEARCH_SEMESTER: {{ .Values.semanticSearch.defaultSemester | quote }}
  {{- end }}
  {{- if .Values.semanticSearch.allowedSubjects }}
  SEMANTIC_SEARCH_ALLOWED_SUBJECTS: {{ .Values.semanticSearch.allowedSubjects | quote }}
  {{- end }}

---

apiVersion: v1
kind: Service
metadata:
  name: {{ include "bt-app.semanticSearchName" . }}-svc
  labels:
    {{- include "bt-app.semanticSearchLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "bt-app.semanticSearchLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.semanticSearch.port }}
      targetPort: {{ .Values.semanticSearch.port }}

