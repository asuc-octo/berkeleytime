{{ if eq .Values.env "dev" }}
# only run cleanup job in dev environment
#
# The expiry time is computed at install/upgrade time and stored in a
# ConfigMap, so a restarted cleanup pod resumes against the same deadline
# (and uninstalls right away if it has already passed) instead of starting a
# fresh sleep. Redeploying the release resets the deadline to now + ttl.
{{- $expiresAt := add (now | unixEpoch) (mulf .Values.ttl 3600 | int64) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bt-app.cleanupName" . }}
  labels:
    {{- include "bt-app.cleanupLabels" . | nindent 4 }}
data:
  expires-at: {{ $expiresAt | quote }}
  expires-at-utc: {{ dateInZone "2006-01-02T15:04:05Z" ($expiresAt | int64) "UTC" | quote }}

---

apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "bt-app.cleanupName" . }}
  labels:
    {{- include "bt-app.cleanupLabels" . | nindent 4 }}
spec:
  # Keep retrying a failed uninstall rather than giving up and leaving the
  # release running forever.
  backoffLimit: 100
  template:
    spec:
      serviceAccountName: bt-k8s-role
      containers:
        - name: cleanup
          image: alpine/helm
          command:
            - sh
            - -c
            - |
              # Re-read the deadline every minute so a redeploy that extends
              # it is picked up by the running pod.
              while [ "$(date +%s)" -lt "$(cat /etc/cleanup/expires-at)" ]; do
                sleep 60
              done
              echo "Cleaning up {{ .Release.Name }} (expired at $(cat /etc/cleanup/expires-at-utc))"
              helm uninstall {{ .Release.Name }} --namespace={{ .Release.Namespace }}
          volumeMounts:
            - name: expiry
              mountPath: /etc/cleanup
              readOnly: true
      volumes:
        - name: expiry
          configMap:
            name: {{ include "bt-app.cleanupName" . }}
      restartPolicy: OnFailure
{{ end }}
