# Staging overrides. Install with:
#   helm upgrade bt-stage-mongo ./infra/mongo -n <ns> -f values-staging.yaml
#
# Default values.yaml is aimed at prod (hostPath, memory). This file keeps smaller limits for stage.

hostPath: /data/stage/db

mongodb:
  commonLabels:
    env: stage

  # Staging must not take CPU from production on the shared node. Before
  # this, staging Mongo had no CPU limit and used more CPU than prod.
  resources:
    limits:
      cpu: 500m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 1Gi
