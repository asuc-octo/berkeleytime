# Staging overrides, layered on values.yaml (prod-oriented defaults).
# Deployed by .github/workflows/cd-infra.yaml as bt-stage-mongo.

hostPath: /data/stage/db

mongodb:
  commonLabels:
    env: stage

  # Staging must not take CPU from production on the shared node.
  resources:
    limits:
      cpu: 500m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 1Gi
