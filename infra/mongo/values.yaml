# Prod defaults. Staging / dev: use -f values-staging.yaml / -f values-dev.yaml instead of copying this file.
env: prod

# Paths on the host machine. Must be different for each environment.
# db83 is a fresh data dir for MongoDB 8.3; the pre-8.3 Bitnami data in /data/<env>/db is
# left untouched for rollback (8.0 data files cannot be opened directly by 8.3).
hostPath: /data/prod/db83
# mongot keeps its Lucene index segments here. Losing it only forces a full re-index.
hostPathSearch: /data/prod/mongot

replSetName: rs0

# Self-managed MongoDB Search requires mongod >= 8.3.4 and mongot >= 1.70.1.
# https://www.mongodb.com/docs/search/self-managed/current/deployment/compatibility-requirements/
image: mongodb/mongodb-community-server:8.3.11-ubuntu2204
searchImage: mongodb/mongodb-community-search:1.70.5
# Used by init containers to fix permissions on hostPath volumes and the keyfile.
busyboxImage: busybox:1.37

# uid/gid mongod runs as. Data on hostPath is chown'd to this by an init container.
runAsUser: 1000
runAsGroup: 1000

persistence:
  size: 10Gi
  searchSize: 10Gi

resources:
  limits:
    memory: 4Gi
  requests:
    memory: 2Gi

# mongot is a JVM process; it sizes its heap from the container memory limit.
searchResources:
  limits:
    memory: 2Gi
  requests:
    memory: 1Gi

auth:
  # Secret holding the keys below. Defaults to "<release>-auth".
  #   keyfile          replica set keyfile (base64 chars, 6-1024 long)
  #   root-password    "root" user (root role), used by backups/migrations
  #   app-password     "bt" user (readWrite on bt), used by backend + datapuller
  #   mongot-password  "mongot" user (searchCoordinator), used by mongot to sync
  # Passwords must be URL-safe (they are interpolated into MONGODB_URI); use `openssl rand -hex 32`.
  secretName: ""
  # If set, the chart renders a SealedSecret named secretName with this encryptedData
  # (output of `kubeseal --scope namespace-wide`). Leave empty to manage the Secret out of band.
  encryptedData: {}
