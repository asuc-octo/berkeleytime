# path in host machine. should depend on environment and be different for each mongo pod.
# Staging: use -f values-staging.yaml (smaller memory + /data/stage/db) instead of copying this file.
hostPath: /data/prod/db

mongodb:
  commonLabels:
    env: prod

  architecture: replicaset
  arbiter:
    enabled: false
  replicaCount: 1

  auth:
    enabled: false

  # MongoDB 8.0 removed storage.journal.enabled; custom config omits it to avoid "Unrecognized option"
  configuration: |
    storage:
      dbPath: /bitnami/mongodb/data/db
      directoryPerDB: false
    systemLog:
      destination: file
      path: /opt/bitnami/mongodb/logs/mongodb.log
      logAppend: true
    net:
      port: 27017
      bindIp: 0.0.0.0
    processManagement:
      pidFilePath: /opt/bitnami/mongodb/tmp/mongodb.pid
    replication:
      replSetName: rs0

  persistence:
    storageClass: manual

    # path in pod. should be same for all mongo pods.
    size: 10Gi

  # The chart defaults to the `latest` tag, so any fresh pull could start a
  # different MongoDB major version. Pin the digest of the image that is
  # running (kubectl get pod <pod> -o jsonpath='{.status.containerStatuses[*].imageID}').
  # .github/workflows/cd-infra.yaml refuses to apply while a digest is empty.
  # Pinned to what bt-prod-mongo ran on 2026-11-08: MongoDB 8.3.4.
  image:
    digest: sha256:c65378e6661b987e22f78f08ecd3708721cb5a9a99705e1e23bbcb36a887c209

  # required for persistence. without, data is not saved across pod restarts.
  volumePermissions:
    enabled: true
    image:
      digest: sha256:d38549182ca4924d9c55bc430d3636e0680b6a327087004c73f73b23d80f0d77

  # Prod-oriented defaults; staging uses values-staging.yaml for lower limits.
  # The CPU request is the share mongod is guaranteed when the node is busy.
  # Without one it got the smallest share on the node (about 0.1 core,
  # inherited from the volume-permissions init container).
  resources:
    limits:
      cpu: "4"
      memory: 4Gi
    requests:
      cpu: "2"
      memory: 2Gi

  # The probes run mongosh inside the container; 5s was not enough while the
  # node was busy, and failed probes take mongod out of service.
  readinessProbe:
    timeoutSeconds: 10

  # Mount migrations ConfigMap at /migrations (same path as Docker Compose).
  # ConfigMap is templates/migrations-configmap.yaml → {{ .Release.Name }}-migrations.
  # Bitnami renders extraVolumes with tpl, so this tracks the release name without --set.
  extraVolumes:
    - name: migrations
      configMap:
        name: "{{ .Release.Name }}-migrations"
  extraVolumeMounts:
    - name: migrations
      mountPath: /migrations
      readOnly: true
