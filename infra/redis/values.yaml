# Prod-oriented defaults; staging layers values-staging.yaml on top.
# Deployed by .github/workflows/cd-infra.yaml as bt-prod-redis.
redis:
  commonLabels:
    env: prod

  architecture: standalone

  # The chart defaults to the `latest` tag. Pin the digest of the image that
  # is running (kubectl get pod <pod> -o jsonpath='{.status.containerStatuses[*].imageID}').
  # .github/workflows/cd-infra.yaml refuses to apply while a digest is empty.
  image:
    digest: ""

  auth:
    enabled: false

  master:
    persistence:
      enabled: false
    # Without explicit resources the chart applied its "nano" preset (192Mi),
    # and Redis was OOM-killed on Oct 22, logging every user out.
    # maxmemory stays well below the memory limit so Redis evicts keys
    # instead of being killed.
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    configuration: |
      maxmemory 350mb
      maxmemory-policy volatile-lru
      save ""
