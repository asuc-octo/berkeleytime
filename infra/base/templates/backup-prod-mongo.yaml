apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup-prod-mongo
  namespace: bt
spec:
  schedule: "0 * * * *" # Hourly
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  suspend: false
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 180
      template:
        spec:
          serviceAccountName: bt-k8s-role
          containers:
            - name: backup-prod-mongo
              image: alpine/k8s:1.29.11
              command:
                - sh
                - -c
                - |
                  set -e # Exit immediately if a command fails

                  # Cleanup on exit (success or failure)
                  cleanup() {
                    rm -f /tmp/prod_backup.gz
                  }
                  trap cleanup EXIT

                  # Capture the timestamp before dumping so a slow dump can't
                  # roll the backup into the next hour
                  backup_timestamp=$(date +%Y%m%d%H)
                  day_of_week=$(date +%u) # 7 = Sunday

                  # Find production MongoDB pod
                  prod_pod=$(kubectl get pods -o custom-columns=NAME:.metadata.name --no-headers -n bt | grep 'bt-prod-mongo')

                  # Dump production MongoDB state
                  echo "Dumping prod MongoDB state..."
                  kubectl exec --namespace=bt \
                    "$prod_pod" -- mongodump --archive=/tmp/prod_backup.gz --gzip
                  kubectl cp --namespace=bt \
                    "$prod_pod:/tmp/prod_backup.gz" /tmp/prod_backup.gz
                  kubectl exec --namespace=bt \
                    "$prod_pod" -- rm /tmp/prod_backup.gz

                  # Upload production MongoDB backup
                  # Retention is enforced by R2 lifecycle rules per prefix
                  # (see infra/cloudflare/r2-lifecycle.sh):
                  #   hourly/ 1d, daily/ 30d, weekly/ 91d, persistent/ 730d
                  echo "Uploading backup to s3 bucket..."
                  backup_date=${backup_timestamp%??}
                  date_day=${backup_date#??????}
                  date_hour=${backup_timestamp#????????}
                  hourly_key="hourly/prod_backup-$backup_timestamp.gz"

                  aws s3 cp /tmp/prod_backup.gz "s3://$BUCKET_NAME/$hourly_key" \
                    --endpoint-url=$ENDPOINT_URL \
                    --checksum-algorithm CRC32

                  # Promote the 5 AM backup into the longer-lived tiers via
                  # server-side copy (no re-upload)
                  promote() {
                    echo "Also copying to $1/"
                    aws s3 cp "s3://$BUCKET_NAME/$hourly_key" \
                      "s3://$BUCKET_NAME/$1/prod_backup-$backup_date.gz" \
                      --endpoint-url=$ENDPOINT_URL
                  }

                  if [ "$date_hour" = "05" ]; then
                    promote daily
                    if [ "$day_of_week" = "7" ]; then
                      promote weekly
                    fi
                    if [ "$date_day" = "01" ]; then
                      promote persistent
                    fi
                  fi

                  echo "MongoDB backup completed successfully!"
              env:
                - name: TZ
                  value: America/Los_Angeles
                - name: ENDPOINT_URL
                  value: https://ff660bd2dac18c00551ed509d24ef4d7.r2.cloudflarestorage.com
                - name: BUCKET_NAME
                  value: prod-mongo-backups
              envFrom:
                - secretRef:
                    name: cloudflare-prod-mongo-secret
              resources:
                requests:
                  ephemeral-storage: "256Mi"
                limits:
                  ephemeral-storage: "1Gi"
              volumeMounts:
                - name: tmp-storage
                  mountPath: /tmp
          volumes:
            - name: tmp-storage
              emptyDir:
                sizeLimit: 5Gi
          restartPolicy: Never
