apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup-prod-mongo-public
  namespace: bt
spec:
  schedule: "0 5 * * *" # Daily
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  suspend: false
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 180
      template:
        spec:
          serviceAccountName: bt-k8s-role
          containers:
            - name: backup-prod-mongo-public
              image: docker.io/jayanacpc/bt-mongo-backup@sha256:29559e20c2fd7c4a1ba2383d20ebdd43763907f046665bb54ea5894b94966aea
              command:
                - sh
                - -c
                - |
                  set -e # Exit immediately if a command fails

                  # Cleanup on exit (success or failure)
                  cleanup() {
                    rm -f /tmp/prod_public_backup-*.gz
                  }
                  trap cleanup EXIT

                  # Date for daily public backup filename (YYYYMMDD)
                  backup_date=$(date +%Y%m%d)

                  echo "Dumping public MongoDB collections..."
                  mongodump \
                    --host=bt-prod-mongo-mongodb-0.bt-prod-mongo-mongodb-headless.bt.svc.cluster.local \
                    --port=27017 \
                    --numParallelCollections=1 \
                    --db bt \
                    --excludeCollection users \
                    --excludeCollection plans \
                    --excludeCollection plans_duplicate_archive_pr2_20260909 \
                    --excludeCollection planterms \
                    --excludeCollection labels \
                    --excludeCollection majorreqs \
                    --excludeCollection ratings \
                    --excludeCollection aggregatedmetrics \
                    --excludeCollection schedules \
                    --excludeCollection collections \
                    --excludeCollection pods \
                    --excludeCollection banners \
                    --excludeCollection bannerviewcounts \
                    --excludeCollection classviewcounts \
                    --excludeCollection curatedclasses \
                    --excludeCollection clickevents \
                    --excludeCollection routeredirects \
                    --excludeCollection semester-roles \
                    --excludeCollection staff-members \
                    --excludeCollection targetedmessages \
                    --excludeCollection trackingevents \
                    --archive="/tmp/prod_public_backup-$backup_date.gz" \
                    --gzip

                  # Upload sanitized backup to public S3/R2 bucket
                  echo "Uploading public backup to s3 bucket..."
                  aws s3 cp "/tmp/prod_public_backup-$backup_date.gz" "s3://$BUCKET_NAME_PUBLIC/daily/prod_public_backup-$backup_date.gz" \
                    --endpoint-url="$ENDPOINT_URL_PUBLIC" \
                    --checksum-algorithm CRC32

                  echo "Public MongoDB backup completed successfully!"
              env:
                - name: TZ
                  value: America/Los_Angeles
                - name: ENDPOINT_URL_PUBLIC
                  value: https://ff660bd2dac18c00551ed509d24ef4d7.r2.cloudflarestorage.com
                - name: BUCKET_NAME_PUBLIC
                  value: prod-mongo-public-backups
              envFrom:
                - secretRef:
                    name: cloudflare-prod-mongo-secret
              resources:
                requests:
                  ephemeral-storage: "256Mi"
                limits:
                  ephemeral-storage: "1Gi"
              volumeMounts:
                - name: tmp-storage
                  mountPath: /tmp
          volumes:
            - name: tmp-storage
              emptyDir:
                sizeLimit: 5Gi
          restartPolicy: Never

