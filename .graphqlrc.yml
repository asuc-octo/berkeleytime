# Used by editor GraphQL extensions (e.g. VSCode GraphQL) for schema-aware
# autocomplete in gql`` documents. Not used by the build.
schema:
  - ./packages/gql-typedefs/*.ts
documents:
  - ./apps/frontend/src/lib/api/*.ts
  - ./apps/ag-frontend/src/lib/api/*.ts
  - ./apps/staff-frontend/src/lib/api/*.ts
  - ./apps/semantic-search/app/graphql/*.graphql
