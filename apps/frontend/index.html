<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<meta name="color-scheme" content="light dark" />
	<link rel="preconnect" href="https://rsms.me" crossorigin />
	<link rel="shortcut icon" href="/favicon.png" />
	<link rel="apple-touch-icon" sizes="76x76" href="/favicon.png" />
	<meta name="description"
		content="Berkeley's online course discovery platform. Berkeleytime is a platform built, maintained, and run by students, just like you. We work hard to simplify and improve the course discovery experience." />
	<title>Berkeleytime</title>

	<!-- Open Graph / Facebook / Discord / LinkedIn / iMessage -->
	<meta property="og:type" content="website" />
	<meta property="og:url" content="https://berkeleytime.com/" />
	<meta property="og:title" content="Berkeleytime" />
	<meta property="og:description"
		content="Berkeley's online course discovery platform. Berkeleytime is a platform built, maintained, and run by students, just like you." />
	<meta property="og:image" content="https://berkeleytime.com/images/linkpreview.png" />
	<meta property="og:image:width" content="1201" />
	<meta property="og:image:height" content="631" />

	<!-- Twitter / X -->
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:url" content="https://berkeleytime.com/" />
	<meta name="twitter:title" content="Berkeleytime" />
	<meta name="twitter:description"
		content="Berkeley's online course discovery platform. Berkeleytime is a platform built, maintained, and run by students, just like you." />
	<meta name="twitter:image" content="https://berkeleytime.com/images/linkpreview.png" />
</head>

<body>
	<style>
		/* No stylesheet exists yet at this point: all CSS arrives with the JS
		   bundle, so the first frame would otherwise paint white. */
		html,
		body {
			margin: 0;
			background-color: #fff;
		}
	</style>
	<script>
		// Set theme before first paint to prevent color flash (FOUC).
		// Mirrors ThemeProvider logic: localStorage "theme" → data-theme attribute.
		(function () {
			var theme = localStorage.getItem("theme");
			var isDark =
				theme === "dark" ||
				(theme !== "light" &&
					window.matchMedia("(prefers-color-scheme: dark)").matches);
			document.body.setAttribute("data-theme", isDark ? "dark" : "light");
			document.documentElement.style.backgroundColor = isDark
				? "#18181b"
				: "#fff";
		})();
	</script>
	<div id="root"></div>
	<script type="module" src="/src/main.tsx"></script>
</body>

</html>
